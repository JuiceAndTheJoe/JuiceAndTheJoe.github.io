<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music | Jose Velasquez</title>
    <link rel="stylesheet" href="music.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <!-- Home Button -->
    <div class="home-button-container">
        <a href="/" class="home-link">
            <img src="../web/knas_liten.png" alt="Return to Homepage" class="spin-on-hover">
            <span class="hover-text">Take me back!</span>
        </a>
    </div>

    <div class="container">
        <!-- Hero Section -->
        <section class="hero">
            <h1>MUSIC</h1>
            <p class="tagline">Sounds from the void</p>
        </section>

        <!-- Released Section - SoundCloud -->
        <section class="section">
            <h2>Released</h2>
            <div class="soundcloud-grid">
                <div class="soundcloud-card">
                    <iframe width="100%" height="166" scrolling="no" frameborder="no" allow="autoplay"
                        src="https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/tracks/1680362358&color=%234fc3f7&auto_play=false&hide_related=true&show_comments=false&show_user=true&show_reposts=false&show_teaser=false">
                    </iframe>
                </div>
                <div class="soundcloud-card">
                    <iframe width="100%" height="166" scrolling="no" frameborder="no" allow="autoplay"
                        src="https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/tracks/1680371169&color=%234fc3f7&auto_play=false&hide_related=true&show_comments=false&show_user=true&show_reposts=false&show_teaser=false">
                    </iframe>
                </div>
                <div class="soundcloud-card">
                    <iframe width="100%" height="166" scrolling="no" frameborder="no" allow="autoplay"
                        src="https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/tracks/1680366543&color=%234fc3f7&auto_play=false&hide_related=true&show_comments=false&show_user=true&show_reposts=false&show_teaser=false">
                    </iframe>
                </div>
            </div>
        </section>

        <!-- Demos & Experiments Section - Local Tracks -->
        <section class="section">
            <h2>Demos & Experiments</h2>

            <!-- Filter Buttons -->
            <div class="filter-container">
                <button class="filter-btn active" data-genre="all">All</button>
                <button class="filter-btn" data-genre="electronic">Electronic</button>
                <button class="filter-btn" data-genre="ambient">Ambient</button>
                <button class="filter-btn" data-genre="experimental">Experimental</button>
            </div>

            <!-- Track Grid -->
            <div id="track-grid" class="track-grid">
                <!-- Tracks rendered by JavaScript -->
            </div>
        </section>
    </div>

    <!-- Fixed Bottom Player -->
    <div class="bottom-player">
        <div id="player-cover">
            <div class="player-cover-placeholder">
                <i class="fas fa-music"></i>
            </div>
        </div>

        <div class="player-track-info">
            <div id="player-title" class="player-track-title">Select a track</div>
            <div id="player-artist" class="player-track-artist">—</div>
        </div>

        <div class="player-controls">
            <button id="prev-btn" class="control-btn" title="Previous">
                <i class="fas fa-step-backward"></i>
            </button>
            <button id="play-pause-btn" class="control-btn play-pause" title="Play/Pause">
                <i class="fas fa-play"></i>
            </button>
            <button id="next-btn" class="control-btn" title="Next">
                <i class="fas fa-step-forward"></i>
            </button>
        </div>

        <div class="waveform-container">
            <div id="waveform"></div>
            <div class="player-time">
                <span id="current-time">0:00</span>
                <span id="total-time">0:00</span>
            </div>
        </div>

        <div class="volume-control">
            <i class="fas fa-volume-up"></i>
            <input type="range" id="volume-slider" class="volume-slider" min="0" max="100" value="80">
        </div>
    </div>

    <!-- WaveSurfer.js -->
    <script src="https://unpkg.com/wavesurfer.js@7"></script>
    <script src="music.js"></script>
</body>
</html>
